apply plugin: 'application'
application { mainClass = 'adventure.desktop.Launcher' }
sourceSets.main.resources.srcDirs += [rootProject.file('assets').path]
dependencies {
    implementation project(':core')
    implementation 'com.badlogicgames.gdx:gdx-backend-lwjgl3:1.13.1'
    implementation 'com.badlogicgames.gdx:gdx-platform:1.13.1:natives-desktop'
}
run {
    workingDir = rootProject.file('assets')
    if (System.getProperty('os.name').toLowerCase().contains('mac')) jvmArgs '-XstartOnFirstThread'
}
jar {
    dependsOn configurations.runtimeClasspath
    archiveFileName = 'Magnet-Adventure.jar'
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE
    from { configurations.runtimeClasspath.collect { it.isDirectory() ? it : zipTree(it) } }
    exclude 'META-INF/*.SF', 'META-INF/*.RSA', 'META-INF/*.DSA', 'META-INF/INDEX.LIST'
    manifest { attributes 'Main-Class': 'adventure.desktop.Launcher' }
}
